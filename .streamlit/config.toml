[theme]
primaryColor = "#667eea"
backgroundColor = "#0f1419"
secondaryBackgroundColor = "#1a1f2e"
textColor = "#e0e0e0"
font = "sans serif"

[logger]
level = "error"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[server]
port = 8501
headless = true
runOnSave = false
maxUploadSize = 200
enableXsrfProtection = true
